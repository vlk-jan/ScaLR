# v11 grid (2026-10-26): v10_geo with the WaffleIron box cut from +-64 m to
# +-32 m at the same 0.5 m cells, the geo weight cut 10 -> 2 (see
# geo_supervision below), and the proprio aux trained on HELHEST v2.5's labels
# as well as v1.5's (see proprio_supervision; corpus setprop_v25). It is the box DRIFT v26
# deploys (fov +-32, grid [[128,128],[128,32],[128,32]]), so pretraining and
# deployment share extent as well as cell size and every block's reach. On one
# H200 (bf16) it trains ~1.6x faster than +-64. +-24 was no faster and drops
# ~12 % of RELLIS Velodyne pairs (4 % here). Batch stays 12 (4/GPU): 8/GPU fits
# (131.5 GiB peak, flat over 75 min DDP) but is slower per sample (5.0 vs 6.8/s).
# scratch_wi_probe/orch/gridsweep/ (results.txt, crop_loss.txt, memtest/).
#
# v10 (geo): the v9 recipe on the HELHEST_v2_4 corpus with the pretraining
# objective changed where DRIFT's measurements point (DRIFT
# docs/BACKBONE_VALUE.md section 11, 2026-10-19):
#   * the DINOv3 target is an appearance code of the recording session (one
#     patch names the session at 98 %%, 60 %% of its variance is between frames);
#     the student copies it, DRIFT's head memorises it, and a frozen RANDOM
#     WaffleIron beats WI_v9 on held-out sessions. Here every frame's teacher
#     features are CENTRED (their mean over the frame's paired pixels removed)
#     before the loss, so only within-frame appearance contrast is imitated.
#   * a second, cooperative auxiliary predicts from each point's final-layer
#     token what its 0.5 m cell looks like CLOSE UP: z_min, z_max - z_min,
#     z_std and the fraction of returns above z_min + 0.3 m, measured from the
#     sweeps recorded while the robot drove up to it (scripts/write_geo_targets.py,
#     /mnt/personal/vlkjan6/scalr_geo_targets). Label-free, dense, geometric,
#     and the same whichever day the patch was seen. v10 ran it at weight 10
#     on a Huber with delta 0.05 m; that was meant as ~0.1 against a
#     distillation loss of ~0.4, but it logged 0.8-1.8 against 0.7-1.2 and
#     out-pulled distillation 4.6x on the backbone. v11 uses weight 2.
#     Attached at block 36 (768-d tokens), which is what DRIFT reads.
#
# Corpus (v10): --path_dataset /mnt/personal/vlkjan6/setprop_v24 (HELHEST -> v1_5,
# HELHEST_V2 -> v2_4 with its scalr_keyframes.lst, 70,840 frames, held-out
# scenes 0001 0019 0020 0024-0027 0034 0035 excluded), RELLIS and ROUGH as v9.
# v11: --path_dataset /mnt/personal/vlkjan6/setprop_v25, identical except
# HELHEST_V2 -> v2_5. Its poses, calibration and keyframe list are byte-identical
# to v2.4's, and so were 177 sampled clouds (checked 2026-11-10); only proprio_labels/ was
# regenerated. So scalr_geo_targets/HELHEST_v2_5 is a symlink to HELHEST_v2_4.
# 171,673 samples. Everything else is v9: 3 H200s, batch 12, lr 0.006,
# max_pairs 4000, ground_z -0.29. The proprio auxiliary is on v1.5 + v2.5
# labels (v2.5 supplies 66 % of labelled frames and 86 % of labelled points).
#
# v11 also carries fixes from the 2026-11-10 pipeline audit. Five are behind
# keys that are absent (= old behaviour) in every older config: masked_bn,
# align_corners, intensity_dropout, geo height_gate and zmin_relative (see
# below). The rest apply to every config from that date: RELLIS Velodyne
# clouds paired with their own image by frame id (2,056 of 7,793 were on the
# wrong one), the retry loop catching only its own rejections, the atomic
# checkpoint save, and the point-weighted proprio log.
#
point_backbone:
  size_input: 5
  input_features: ["intensity", "xyz", "radius"]
  nb_channels: 768
  nb_class: 1280 # must match the ViT feature size
  depth: 36
  dim_proj: [2, 1, 0]
  grid_shape: [[128, 128], [128, 32], [128, 32]]
  fov: [[-32, -32, -8], [32, 32, 8]]
  num_neighbors: 16
  voxel_size: 0.1
  max_points: 20000
  layernorm: True
  # At most this many point-pixel pairs per frame reach the distillation loss
  # (random subset, redrawn per draw); the backbone still sees the whole cloud.
  # ImPcDataset.__getitem__.
  max_pairs: 4000
  # z is a network input and the translation augmentation is xy-only, so without
  # this every member tells the backbone its mounting height: ground sits at
  # -1.07 m (RELLIS os1), -0.89 (RELLIS vel), -0.41 (ROUGH), -0.29 (HELHEST v1
  # and v2). Each member is shifted by a per-dataset constant onto -0.29,
  # HELHEST's nominal base_link ground (shift 0 for both rigs). DRIFT
  # additionally levels each cloud by gravity; ScaLR does not, so the Odin1
  # ground sits ~4-6 cm higher here than in DRIFT. ImPcDataset.height_shift.
  ground_z: -0.29
  # Embedding BatchNorm batch statistics over real points only (about half of
  # every batch's positions are padding). Training only; eval mode and the
  # state dict are unchanged. WaffleIron/waffleiron/embedding.py.
  masked_bn: True

image_backbone:
  images_encoder: "dinov3_vit_huge_p16"
  feat: "x"
  im_size: [240, 384]
  # False: the upsampled patch map has patch centres where the pixels are.
  # True (upstream, v10 and older) read targets up to 0.47 patch off away from
  # the image centre. models/image_teacher.py.
  align_corners: False

dataloader:
  # 4 per GPU on 3 GPUs, as validated for v8 (the H200 sweep held b4 at 89 GB
  # and lost b8; the robotics_v2 smoke held 4/GPU for 2,990 steps with Odin
  # clouds in the mix). Three GPUs rather than four because the account's quota
  # is 6 and the dataset-side jobs share it.
  #
  # ON 2 GPUS: batch_size 8, lr 0.004, --gres=gpu:2, and ~1.5x the wall clock.
  # batch_size must stay a multiple of the GPU count (distill.py divides it).
  batch_size: 12
  # A log line every 500 steps (default: a tenth of an epoch, 1,430 steps).
  print_freq: 500
  num_workers: 56
  # Both HELHEST members read this list instead of their defaults (v1
  # keyframes.lst = every map-bearing frame; v2 ships no list at all). Written
  # into each root by scripts/write_scalr_keyframes.py -- for v1.5 with
  # --base_list keyframes.lst so DRIFT's map gate is kept, for v2.3 with
  # --exclude <manifest held_out.scenes> (split A: 0001,0015,0016,0020-0023) so
  # DRIFT's validation scenes stay out of pretraining as well.
  helhest_keyframes: scalr_keyframes.lst
  # Matched to v8 and v6 in SAMPLES SEEN, not in epochs: v6 saw 25 x 183,056 =
  # 4.58 M, v8 26 x 169,147 = 4.40 M, this is 32 x 153,861 = 4.92 M (32 was
  # chosen on the 140,521-sample corpus before split A; kept). Epochs
  # are not comparable across a corpus whose composition changed this much.
  # 26 epochs x 14,306 steps (171,673 samples / 12) = 372k steps, 4.46 M samples
  # (v9: 4.92 M). 28 would be 400k steps and v9's 410k used most of the 130 h.
  num_epochs: 26

optim:
  # Linear in the global batch, as every config here has been: 0.002 at 4
  # (WI_768_pretrain), 0.008 at 16 (h200, v4-v7) -> 0.006 at 12.
  lr: 0.006
  weight_decay: 0.03
  # v6's 1500 steps at batch 16 = 24,000 samples = 2,000 steps at batch 12.
  iter_warmup: 2000
  min_lr: 0.00001

loss:
  type: "l2"
  # Per-frame centred teacher targets, see utils/distiller.py (centre_teacher).
  centre_teacher: True
  collapse_weight: 0.0
  collapse_margin: 0.5

augmentations:
  translation_range: 10.0
  # Per sample, with this probability the intensity channel is fed as the input
  # BN's running mean, which is what DRIFT's const_intensity feeds. Real
  # intensity at inference damages the deep blocks in DRIFT; this trains the
  # backbone for both modes. utils/distiller.py.
  intensity_dropout: 0.5

proprio_supervision:
  enabled: True
  weight: 2.0
  hidden_dim: 128
  lr: 0.001
  huber_delta: 0.05
  # v1.5 + v2.5 labels through setprop_v25 (HELHEST -> v1_5, HELHEST_V2 ->
  # v2_5), both gated lists, as this run samples them. BOUND 0.062: pooled per
  # point through the real __getitem__, 3 seeds x 6,000 frames (2026-11-10):
  # 0.0659 / 0.0588 / 0.0615, pooled 0.0621, about +-0.006 per draw (58 % of
  # frames labelled, 55 points per labelled frame, label mean 0.084, median
  # 0.027; v1.5 alone 0.018, v2.5 alone 0.068). The earlier 0.0518 came from
  # 2,500 frames and its "repeat" re-read the same frames. The logged huber is
  # point-weighted since the same date, so the two are the same estimator; a
  # print window is 500 steps = 6,000 frames, so read it over several windows.
  # The labels cover a 2 s horizon; DRIFT trains its head at 4 s.
  constant_bound: 0.062
  depth: null
  # "read": v11 trains the aux on HELHEST v2.5's labels too. v10 ran
  # "ignore" (v2 frames reach the aux loss with an empty mask), and on the v10
  # final checkpoint the proprio gradient on the backbone was noise: from v1.5
  # alone it had ~0 step-to-step consistency (0.004 against distillation's
  # 0.06). No change of loss form fixed that (beta 0.01, L1, standardised
  # labels and a fixed normaliser only rescale it; an earlier head is louder,
  # not more consistent); adding the v2.5 labels raised it to 0.098. The
  # v2.2-v2.4 labels stay rejected (user, 2026-09-30: 5-10x v1.5's, wheel
  # radius and receiver pitch in them); v2.5's are regenerated with the v2
  # robot model and datum (median 0.021 m on valid cells, v1.5 0.013), and
  # the loader refuses label files without that stamp.
  helhest_v2_labels: read
  # OFF, as in every run so far: the aux is supervised on all labelled frames,
  # including the ones DRIFT validates on (datasets/helhest_for_scalr.py,
  # DRIFT_N_FOLDS block). "scene" withholds DRIFT's scene-fold val scenes, which
  # is 42 % of the labels, and the bound above would need re-measuring on what
  # is left. A decision about how this backbone will be judged, not a default.
  drift_val_exclusion: null

geo_supervision:
  enabled: True
  # 2, not v10's 10. Measured on the v10_geo final checkpoint over 200 training
  # frames (per-term gradients on the backbone, scaled by the run's own AdamW
  # second moments): at 10 geo pulled 4.6x harder than distillation (7.9x raw,
  # ~7x on blocks 1-6, 2.7x on 31-36), so it was the main objective rather than
  # an auxiliary. Equal pull is weight ~1.3 (raw) to ~2.2 (preconditioned);
  # 2 puts the two terms roughly level. HELHEST v2 (Odin1) supplies ~66 % of
  # the geo points after the height gate below (74 % before it).
  weight: 2.0
  hidden_dim: 128
  lr: 0.001
  huber_delta: 0.05
  depth: 36
  targets_root: /mnt/personal/vlkjan6/scalr_geo_targets
  # a point gets a target when its cell collected at least this many returns
  # close up (write_geo_targets.py keeps cells of >= 3 sweeps)
  min_count: 8
  # Supervise only points within the targets' own 2 m cap above the cell floor:
  # 35 % of Odin1 geo points were canopy the cell statistics do not describe.
  height_gate: True
  # z_min as floor-minus-own-z: near the ground the absolute target was a copy
  # of the input z. geo_r2 for zmin is therefore not comparable with v10's 0.80.
  zmin_relative: True
