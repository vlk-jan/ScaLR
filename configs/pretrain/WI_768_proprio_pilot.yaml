point_backbone:
  size_input: 5
  input_features: ["intensity", "xyz", "radius"]
  nb_channels: 768
  nb_class: 1280 # nb_class should match the size of the vit features
  depth: 36
  dim_proj: [2, 1, 0]
  grid_shape: [[256, 256], [256, 32], [256, 32]]
  fov: [[-64, -64, -8], [64, 64, 8]]
  num_neighbors: 16
  voxel_size: 0.1
  max_points: 20000
  layernorm: True

image_backbone:
  images_encoder: "dinov3_vit_huge_p16"
  feat: "x"
  im_size: [224, 448]

dataloader:
  batch_size: 16
  num_workers: 56
  # Short pilot, not a full retrain: warm-started from full_v4 (same 3-epoch /
  # lr budget as the posinv/decorr pilots for comparability). Unlike those two
  # this aux is COOPERATIVE (backbone and head minimise the same loss), so a
  # fine-tune budget is a fair first test; if the offline gate below trends
  # positive but hasn't converged, extend before concluding.
  num_epochs: 3

optim:
  lr: 0.0008
  weight_decay: 0.03
  iter_warmup: 150
  min_lr: 0.000001

loss:
  type: "l2"
  collapse_weight: 0.0
  collapse_margin: 0.5

# Proprioceptive compression auxiliary (utils/distiller.py::ProprioHead /
# proprio_loss): masked Huber between a small head on the student's output
# features and wheel-contact compression labels (height_map - odometry
# wheel-bottom z at driven cells, precomputed by DRIFT's
# scripts/generate_proprio_labels.py into HELHEST/<scene>/proprio_labels/;
# 106k labeled keyframes as of 2026-08-18). Only HELHEST samples carry
# labels (~85% of the merged robotics corpus).
#
# Rationale (drift-waffleiron-position-correlation + DRIFT's
# probe_compression.py gate): the DINOv3 target is appearance semantics and
# carries little of the compression signal DRIFT's height head needs
# (frozen-feature held-out R^2 0.32-0.55 vs 0.96 for trivial heightmap
# stats); this is the only supervision in the stack denominated in that
# quantity. weight=10.0 is a judgment call: typical Huber magnitude on these
# labels is ~3e-3 vs distill loss ~0.4-0.7, so 10.0 makes the term a real
# but non-dominant (~5%) fraction of the total at the start.
#
# Watch Pretrain/proprio_huber (should fall), Pretrain/proprio_r2 (online
# head fit -- diagnostic only), and Pretrain/loss (should NOT rise vs the
# other pilots' curves, or the aux is fighting distillation too hard --
# lower weight before extending). The acceptance test for the resulting
# checkpoint is DRIFT's scripts/analysis/probe_compression.py (held-out
# compression R^2 of the frozen 768-d features vs the hm-stats baseline),
# NOT these online curves and NOT position-R^2/linprob.
# The figures this file originally quoted -- 0.96 hm-stats, xydrop_pilot 0.55
# as the best backbone so far -- were measured before the 2026-08-19 target
# fixes and the 2026-08-20 probe-determinism fix and survive neither. Current
# values: hm-stats 0.416, xydrop 0.233 (now the WORST of the four probed
# checkpoints, not the best). See the acceptance-test block in
# WI_768_h200_v5_proprio.yaml, or ~/drift_readout/probe_gate_reference/CANONICAL.md.
proprio_supervision:
  enabled: True
  weight: 10.0
  hidden_dim: 128
  lr: 0.001
  huber_delta: 0.05
