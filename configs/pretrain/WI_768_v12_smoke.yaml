# Mechanics smoke for the HELHEST v1.2 (base_link, single-root) migration of
# datasets/helhest_for_scalr.py -- NOT a training run and NOT a v7 stand-in.
#
# Asks one question: does the distillation loop run end to end on a merged
# root whose HELHEST is /mnt/personal/vlkjan6/HELHEST_v1_2 (base_link .npy
# clouds, T_cam_to_base.txt, no proprio_labels)? So: v6 smoke's values, one
# GPU, a few hundred steps, warm start from v4 so the loss is meaningful from
# step 1, proprio aux ON with zero labels so the dummy-zero path is exercised.
#
# im_size is the camera-paired value for HELHEST v1's 1280x800 (aspect 1.600),
# not v7's Odin1-paired [272, 336] and not v6's [224, 448].
point_backbone:
  size_input: 5
  input_features: ["intensity", "xyz", "radius"]
  nb_channels: 768
  nb_class: 1280
  depth: 36
  dim_proj: [2, 1, 0]
  grid_shape: [[256, 256], [256, 32], [256, 32]]
  fov: [[-64, -64, -8], [64, 64, 8]]
  num_neighbors: 16
  voxel_size: 0.1
  max_points: 20000
  layernorm: True

image_backbone:
  images_encoder: "dinov3_vit_huge_p16"
  feat: "x"
  im_size: [240, 384]

dataloader:
  batch_size: 4
  num_workers: 10
  print_freq: 10
  num_epochs: 1   # the job --time limit cuts this off

optim:
  lr: 0.008
  weight_decay: 0.03
  iter_warmup: 20
  min_lr: 0.00001

loss:
  type: "l2"
  collapse_weight: 0.0
  collapse_margin: 0.5

augmentations:
  translation_range: 10.0

proprio_supervision:
  enabled: True
  weight: 2.0
  hidden_dim: 128
  lr: 0.001
  huber_delta: 0.05
  # v1_3 gated labels, job 11484045; see WI_768_h200_v7_proprio.yaml
  constant_bound: 0.0508
  depth: 12
