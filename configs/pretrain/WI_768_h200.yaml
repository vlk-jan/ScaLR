point_backbone:
  size_input: 5
  input_features: ["intensity", "xyz", "radius"]
  nb_channels: 768
  nb_class: 1280 # nb_class should match the size of the vit features
  depth: 36
  dim_proj: [2, 1, 0]
  grid_shape: [[256, 256], [256, 32], [256, 32]]
  fov: [[-64, -64, -8], [64, 64, 8]]
  num_neighbors: 16
  voxel_size: 0.1
  max_points: 20000
  layernorm: True

image_backbone:
  images_encoder: "dinov3_vit_huge_p16"
  feat: "x"
  im_size: [224, 448]
 
dataloader:
  batch_size: 16
  num_workers: 56
  num_epochs: 25

optim:
  lr: 0.008
  weight_decay: 0.03
  iter_warmup: 1500
  min_lr: 0.00001

loss:
  # "l2" is the original ScaLR objective: Euclidean distance between the
  # L2-normalised student and teacher features. "cosine" optimises 1 - cos,
  # which ranks identically but whose gradient stays bounded as the two vectors
  # align (d/dx sqrt(x) diverges at 0). Changing this changes the loss scale,
  # so the LR would need retuning -- do not flip it mid-campaign.
  type: "l2"
  # Anti-collapse penalty on the mean off-diagonal cosine of the student
  # features, hinged at collapse_margin. 0 disables it, which is the default:
  # the diversity statistic is logged either way (Pretrain/diversity_point and
  # Pretrain/diversity_image in tensorboard), and logging alone would have
  # caught the x_pre_norm target collapse.
  collapse_weight: 0.0
  collapse_margin: 0.5
