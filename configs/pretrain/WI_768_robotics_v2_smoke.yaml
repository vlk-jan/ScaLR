# Mechanics smoke for `--dataset robotics_v2`: RELLIS + ROUGH + HELHEST v1.5 +
# HELHEST v2 (Odin1) in one corpus, with the ground-height normalisation on.
# Not a training recipe: one H200, batch 4, cut off by the job's time limit.
# What it has to show: the v2 loader feeds the GPU pipeline inside mixed
# batches (fisheye pairs, 1600x1000 crop -> [240, 384]), the loss falls from a
# warm start, and the aux head still sees HELHEST v1 labels while v2 frames
# contribute none.
point_backbone:
  size_input: 5
  input_features: ["intensity", "xyz", "radius"]
  nb_channels: 768
  nb_class: 1280
  depth: 36
  dim_proj: [2, 1, 0]
  grid_shape: [[256, 256], [256, 32], [256, 32]]
  fov: [[-64, -64, -8], [64, 64, 8]]
  num_neighbors: 16
  voxel_size: 0.1
  max_points: 20000
  layernorm: True
  # Every member's ground at HELHEST's base_link height, so z stops encoding
  # the mount (-1.07 RELLIS os1, -0.89 vel, -0.41 ROUGH, -0.29 HELHEST v1/v2).
  # See datasets/im_pc_dataset.py::height_shift.
  ground_z: -0.29

image_backbone:
  images_encoder: "dinov3_vit_huge_p16"
  feat: "x"
  # 1.600: RELLIS and ROUGH 1920x1200, HELHEST v1 1280x800, v2 cropped 1600x1000
  im_size: [240, 384]

dataloader:
  batch_size: 4
  num_workers: 10
  print_freq: 10
  num_epochs: 1   # the job --time limit cuts this off

optim:
  lr: 0.008
  weight_decay: 0.03
  iter_warmup: 20
  min_lr: 0.00001

loss:
  type: "l2"
  collapse_weight: 0.0
  collapse_margin: 0.5

augmentations:
  translation_range: 10.0

proprio_supervision:
  enabled: True
  weight: 2.0
  hidden_dim: 128
  lr: 0.001
  huber_delta: 0.05
  # HELHEST v1.5 labels (setprop/HELHEST -> HELHEST_v1_5); v2 carries none.
  constant_bound: 0.0196
  depth: 12
