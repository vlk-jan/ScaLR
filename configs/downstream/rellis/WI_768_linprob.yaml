waffleiron:
  drop_path: 0.0

classif:
  nb_class: 19  # Number of classes in rellis (after removing the void class)

dataloader:
  batch_size: 24
  num_workers: 48
  max_points: 50000

augmentations:
  rotation:
    - [2, 6]
  flip_xy: null
  scale:
    - [4, 5, 6, 7]
    - 0.1

loss:
  lovasz: 1.0

optim:
  lr: .001
  weight_decay: 0.003
  layer_decay: null

scheduler:
  min_lr: 0.00001
  max_epoch: 25
  epoch_warmup: 5
